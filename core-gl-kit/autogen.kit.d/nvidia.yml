cuda_kit:
  generator: builtin-dirlisting
  markdevkit_min_version: 0.29.0
  extensions_defs:
    custom:
      opts:
        script: scripts/nvidia-cuda-toolkit.sh

  defaults:
    category: dev-util
    files_dir: '{{ .Values.pn }}'
    template: ../../templates/simple.tmpl
    dir:
      url: '{{ .Values.base_url }}'
      matcher: 'version_[0-9.]+.json'
      ignore_artefacts: true
    transform:
      - kind: string
        match: version_
        replace: ''
      - kind: string
        match: '.json'
        replace: ''
    extensions:
      - custom
    vars:
      base_url: https://developer.download.nvidia.com/compute/cuda/repos/runfile/x86_64/
      iuse: amd64 arm64 clang examples
      restrict: strip
      license: NVIDIA-CUDA
      desc: NVIDIA CUDA Toolkit (compiler and friends)
      s: '${WORKDIR}'
      extra_envs:
        - 'QA_PREBUILT="/opt/nvidia-cuda-toolkit/*"'
      inherit:
        - unpacker
      bdepend: |
        clang? (
          sys-devel/clang
        )
        sys-process/numactl
        examples? (
          media-libs/freeglut
          media-libs/glu
        )
      dirs:
        - cuda_cccl
        - cuda_crt
        - cuda_cudart
        - cuda_cuxxfilt
        - cuda_nvcc
        - cuda_nvml_dev
        - cuda_nvrtc
        - cuda_nvtx
        - cuda_opencl
        - cuda_profiler_api
        - cuda_sandbox_dev
        - libcublas
        - libcufft
        - libcufile
        - libcuobjclient
        - libcurand
        - libcusolver
        - libcusparse
        - libnpp
        - libnvfatbin
        - libnvjitlink
        - libnvjpeg
        - libnvptxcompiler
        - libnvvm

      # It seems that is better keep all the libraries
      # under a single directory (for lib,include) to better support NVIDIA
      # Cuda Toolkit detection.
      body: |
        {{- $vmajor := join "." ( slice ( splitList "." $.Values.version ) 0 1 ) }}
        pkg_setup() {
          if use amd64; then
            narch=x86_64
          else
            if use arm64; then
              narch=sbsa
            else
              die "unknown arch ${ARCH}"
            fi
          fi
          export narch
        }
        src_configure() {
          :
        }
        src_compile() {
          :
        }
        src_install() {
          local target_path=/opt/${PN}
          local dirs=(
          {{- range $dir := .Values.dirs }}
            {{ $dir }}
          {{- end }}
          )

          dodir "${target_path}/lib"
          dodir "${target_path}/include"
          dosym "${target_path}/lib" "${target_path}/lib64"

          for d in ${dirs[@]}; do
            insinto "${target_path}/"

            {{- if or ( eq $vmajor "12" ) ( eq $vmajor "11" ) }}
            if [ "${d}" = "cuda_nvcc" ] ; then
              cd ${WORKDIR}/builds/${d}/
              doins -r nvvm/
              if [ -d ${WORKDIR}/builds/${d}/bin/ ] ; then
                cd ${WORKDIR}/builds/${d}/
                doins -r bin/
              fi
              if [ -d ${WORKDIR}/builds/${d}/targets/${narch}-linux/ ] ; then
                cd ${WORKDIR}/builds/${d}/targets/${narch}-linux/
                doins -r include/
                if [ -d ${WORKDIR}/builds/${d}/targets/${narch}-linux/lib/ ] ; then
                  doins -r lib/
                fi
              fi
            {{- else }}
            if [ "${d}" = "libnvvm" ] ; then
              cd ${WORKDIR}/builds/${d}/
              doins -r nvvm/
            {{- end }}
            else
              if [ -d ${WORKDIR}/builds/${d}/targets/${narch}-linux/ ] ; then
                cd ${WORKDIR}/builds/${d}/targets/${narch}-linux/
                doins -r include/
                if [ -d ${WORKDIR}/builds/${d}/targets/${narch}-linux/lib/ ] ; then
                  doins -r lib/
                fi
              fi
              if [ -d ${WORKDIR}/builds/${d}/bin/ ] ; then
                cd ${WORKDIR}/builds/${d}/
                doins -r bin/
              fi
            fi

          done

          # Fix exec permissions
          chmod a+x "${D}"/${target_path}/bin/*
          chmod a+x "${D}"/${target_path}/nvvm/bin/cicc

          # Remove broken links
          rm "${D}"/${target_path}/lib/lib64
          rm "${D}"/${target_path}/include/include

          newenvd "${FILESDIR}"/99cuda.envd 99cuda
          dodir ${target_path}/pkgconfig
          insinto ${target_path}/pkgconfig
          cp "${FILESDIR}"/{{ .Values.pn }}.pc .
          sed -i -e 's|VERSION|{{ .Values.version }}|g' {{ .Values.pn }}.pc
          doins {{ .Values.pn }}.pc

          dodir /etc/revdep-rebuild
          insinto /etc/revdep-rebuild
          newins "${FILESDIR}"/{{ .Values.pn }}.revdep 80{{ .Values.pn }}
        }

  packages:
    - nvidia-cuda-toolkit:
        # 13
        selector:
          - '<14.0'
          - '>13.0'

    - nvidia-cuda-toolkit:
        # 12
        selector:
          - '<13.0'
          - '>12.0'

    - nvidia-cuda-toolkit:
        # 11
        selector:
          - '<12.0'
          - '>11.0'

nncl:
  generator: builtin-github
  defaults:
    category: dev-util
    files_dir: "{{ .Values.pn }}"
    template: ../../templates/simple-github.tmpl
    github:
      query: releases
      user: NVIDIA
      repo: nccl
      # Only real NCCL releases ("NCCL vX.Y.Z Release"); the repo also
      # publishes NCCL4Py/NCCL EP releases that must not become versions.
      match: 'NCCL v'

    transform:
      - kind: string
        match: 'NCCL v'
        replace: ''
      - kind: string
        match: ' Release'
        replace: ''
      - kind: string
        match: '-'
        replace: '.'
    vars:
      # NVIDIA distributes NCCL under the "License For Customer Use of NVIDIA
      # Software" (NVIDIA-r2), consistent with the rest of the NVIDIA stack
      # (nvidia-drivers, nvidia-cuda-toolkit). Without an explicit license,
      # autogen falls back to the GitHub API spdx_id, which is NOASSERTION for
      # NCCL (dual-licensed Apache-2.0 + BSD, unmappable to one SPDX id) -- an
      # unregistered license that gets the ebuild license-masked on emerge.
      # The BDEPEND dev-util/nvidia-cuda-toolkit (NVIDIA-CUDA) is accepted via
      # /etc/portage/package.license.
      license: NVIDIA-r2
      inherit:
        - cmake
      bdepend: |
        dev-util/nvidia-cuda-toolkit
      # CMake unconditionally executes the CUDA compiler-ABI probe binary during
      # native-architecture detection (cmake_cuda_architectures_native). The
      # binary links libcudart, whose runtime renames its own threads via
      # open_wr(/proc/self/task/<tid>/comm); the portage sandbox denies that
      # write and kills src_configure. The detected value is unused (arches are
      # pinned via CUDAARCHS) but the run cannot be skipped, so allow the
      # harmless self-thread write. Note: /proc/self must be the allow prefix
      # -- the sandbox canonicalizes it to /proc/<pid> before rule matching,
      # so narrower prefixes (/proc/self, /proc/self/task) do NOT match.
      body: |
        src_configure() {
          SANDBOX_WRITE="${SANDBOX_WRITE:+${SANDBOX_WRITE}:}/proc"
          export SANDBOX_WRITE
          cmake_src_configure
        }

  packages:

    - nvidia-nccl:


