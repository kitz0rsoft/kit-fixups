ruby_gen:
  defaults:
    cat: dev-lang
    category: dev-lang
    template: templates/ruby3.tmpl
    unmasked: True
  template:
    engine: j2cli
  generator: builtin-dirlisting
  packages:
    - ruby:
        dir:
          url: "https://cache.ruby-lang.org/pub/ruby/3.3/"
          matcher: 'ruby-[0-9]+\.[0-9]+\.[0-9]+\.tar\.xz'
        transform:
          - kind: regex
            match: '^ruby-(.*)\.tar\.xz$'
            replace: '$1'
        selector:
          - ">=3.3.14"
          - "<3.3.15"
        vars:
          unmasked: true
          bundled_gems:
            - dev-ruby/debug-1.9.2
            - dev-ruby/matrix-0.4.2
            - dev-ruby/minitest-5.20.0
            - dev-ruby/net-ftp-0.3.4
            - dev-ruby/net-imap-0.4.21
            - dev-ruby/net-pop-0.1.2
            - dev-ruby/net-smtp-0.5.1
            - dev-ruby/power_assert-2.0.3
            - dev-ruby/prime-0.1.2
            - dev-ruby/rake-13.1.0
            - dev-ruby/rbs-3.4.0
            - dev-ruby/rexml-3.4.4
            - dev-ruby/rss-0.3.1
            - dev-ruby/test-unit-3.6.1
            - dev-ruby/typeprof-0.21.9
          pdepends:
            - virtual/rubygems-18.0
            - dev-ruby/bundler-2.5.7
            - dev-ruby/did_you_mean-1.6.3
            - dev-ruby/json-2.7.2
          pdepend_rdoc: ">=dev-ruby/rdoc-6.6.2"
          eselect_version: "20221225"
          news_doc: "NEWS.md"
          target: "ruby33"
